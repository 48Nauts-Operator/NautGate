name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      # uv reads requires-python (>=3.12) from core/pyproject.toml and
      # provisions a matching interpreter; --locked verifies uv.lock is in sync.
      - name: Install deps
        run: cd core && uv sync --locked
      - name: Lint
        run: just lint
      - name: Verify Homebrew resources
        run: uv run --project core python packaging/homebrew/gen_resources.py --check
      - name: Validate portable production Compose
        run: just validate-production-compose
      - name: Test
        run: just test

  sb-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install extension dependencies
        run: uv sync --project extensions/sb-attest --locked
      - name: Lint extension
        run: uv run --project extensions/sb-attest ruff check extensions/sb-attest
      - name: Check extension formatting
        run: uv run --project extensions/sb-attest ruff format --check extensions/sb-attest
      - name: Test extension
        run: uv run --project extensions/sb-attest pytest extensions/sb-attest/tests -q
