name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      # uv reads requires-python (>=3.12) from core/pyproject.toml and
      # provisions a matching interpreter; --locked verifies uv.lock is in sync.
      - name: Install deps
        run: cd core && uv sync --locked
      # CONTRIBUTING documents the lint gate as `ruff check` clean. The justfile's
      # `lint` recipe additionally runs `ruff format --check`, which the repo does
      # not yet satisfy — gate CI on ruff check until the formatter is adopted.
      - name: Lint
        run: cd core && uv run ruff check .
      - name: Test
        run: just test
