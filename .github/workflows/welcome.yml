name: Welcome

# Greets a contributor on their FIRST issue or pull request and points them at
# the community rules. Uses pull_request_target so the comment can be posted on
# PRs from forks (the action only comments — it never checks out fork code).

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue on **NautGate**!

            If you'd like to be part of the project, please have a read of the
            community rules first:

            - 📜 [Contributing guide](https://github.com/48Nauts-Operator/NautGate/blob/main/CONTRIBUTING.md) — ground rules, dev setup, how we work
            - 🤝 [Code of Conduct](https://github.com/48Nauts-Operator/NautGate/blob/main/CODE_OF_CONDUCT.md)
            - 🔒 [Security policy](https://github.com/48Nauts-Operator/NautGate/blob/main/SECURITY.md) — please report vulnerabilities privately, not in an issue

            A maintainer will take a look soon. Thanks for helping make NautGate better!
          pr-message: |
            👋 Thanks for your first pull request to **NautGate**!

            If you'd like to be part of the project, please make sure you've read
            the community rules — contributions are accepted under their terms:

            - 📜 [Contributing guide](https://github.com/48Nauts-Operator/NautGate/blob/main/CONTRIBUTING.md) — ground rules, dev setup, and the contributor license terms
            - 🤝 [Code of Conduct](https://github.com/48Nauts-Operator/NautGate/blob/main/CODE_OF_CONDUCT.md)

            Please confirm CI is green and that your change traces to an issue or a
            clear need. A maintainer will review shortly — welcome aboard!
