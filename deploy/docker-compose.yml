# NautGate — local dev compose stack.
# Default `up` brings nautgate-db + nautrouter (the sidecar wrap target).
# nautgate-core is profiled `full` — Day 1-3 iteration runs it via `uv run uvicorn` directly.

services:
  nautgate-db:
    image: postgres:16
    container_name: nautgate-db
    environment:
      POSTGRES_USER: nautgate
      POSTGRES_PASSWORD: nautgate
      POSTGRES_DB: nautgate
    volumes:
      - nautgate-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautgate -d nautgate"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nautrouter:
    build:
      context: ../vendor/NautRouter
    container_name: nautrouter
    environment:
      NAUT_PORT: "8404"
      NAUT_WS_PORT: "8403"
      NAUT_PROFILE: ${NAUTGATE_PROFILE:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LMSTUDIO_URL: ${LMSTUDIO_BASE_URL:-}
      MEMORY_API: ${MEMORY_API:-}
    ports:
      - "127.0.0.1:8404:8404"   # loopback only; never expose
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8404/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  nautgate-core:
    build:
      # Context is the repo root so the image can ship config/ (routing +
      # pricing tables live outside core/). Dockerfile path is relative to it.
      context: ..
      dockerfile: core/Dockerfile
    container_name: nautgate-core
    depends_on:
      nautgate-db:
        condition: service_healthy
      nautrouter:
        condition: service_healthy
    environment:
      NAUTGATE_DB_URL: postgres://nautgate:nautgate@nautgate-db:5432/nautgate
      NAUTGATE_LISTEN_HOST: 0.0.0.0
      NAUTGATE_LISTEN_PORT: "8090"
      NAUTGATE_LOG_LEVEL: ${NAUTGATE_LOG_LEVEL:-INFO}
      NAUTGATE_PROFILE: ${NAUTGATE_PROFILE:-auto}
      NAUTROUTER_BASE_URL: http://nautrouter:8404
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    profiles: ["full"]

volumes:
  nautgate-db-data:
