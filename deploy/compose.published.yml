# NautGate — published stack. This is the file served at nautgate.dev/compose.yml.
#
#   curl -fsSL https://nautgate.dev/compose.yml -o docker-compose.yml
#   docker compose up -d
#
# Everything starts by default (no profiles), pulling prebuilt images from GHCR —
# no clone, no build. First-run mints an API key and prints it to the core log:
#   docker compose logs nautgate | grep -A1 'first-run key'
#
# Provider keys are optional. Set the ones you use in a .env file next to this
# compose (or export them), then `docker compose up -d`:
#   OPENROUTER_API_KEY=...    # enables the default auto-tier routing
#   ANTHROPIC_API_KEY=...  OPENAI_API_KEY=...  GEMINI_API_KEY=...

services:
  nautgate-db:
    image: postgres:16
    environment:
      POSTGRES_USER: nautgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nautgate}
      POSTGRES_DB: nautgate
    volumes:
      - nautgate-db-data:/var/lib/postgresql/data
    # Not published — only the core container needs to reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautgate -d nautgate"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nautrouter:
    image: ghcr.io/48nauts-operator/nautrouter:latest
    # To build locally instead of pulling, comment out `image` and uncomment:
    # build:
    #   context: ..
    #   dockerfile: vendor/NautRouter/Dockerfile
    environment:
      NAUT_PORT: "8404"
      NAUT_WS_PORT: "8403"
      NAUT_PROFILE: ${NAUTGATE_PROFILE:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LMSTUDIO_URL: ${LMSTUDIO_BASE_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8404/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  nautgate:
    image: ghcr.io/48nauts-operator/nautgate:latest
    # To build locally instead of pulling, comment out `image` and uncomment:
    # build:
    #   context: ..
    #   dockerfile: core/Dockerfile
    depends_on:
      nautgate-db:
        condition: service_healthy
      nautrouter:
        condition: service_healthy
    environment:
      # Defaults to the bundled Postgres; point at your own by setting
      # NAUTGATE_DB_URL in the environment.
      NAUTGATE_DB_URL: ${NAUTGATE_DB_URL:-postgres://nautgate:${POSTGRES_PASSWORD:-nautgate}@nautgate-db:5432/nautgate}
      NAUTGATE_LOG_LEVEL: ${NAUTGATE_LOG_LEVEL:-INFO}
      NAUTGATE_PROFILE: ${NAUTGATE_PROFILE:-auto}
      NAUTROUTER_BASE_URL: http://nautrouter:8404
      # Encrypts in-app provider keys at rest (Settings -> Providers).
      # Set to a random secret and BACK IT UP — losing it means re-entering
      # those keys. Leave empty to keep provider keys in the env only.
      NAUTGATE_MASTER_KEY: ${NAUTGATE_MASTER_KEY:-}
      # Shared secret the nautproxy sidecar (proxy profile) presents to POST
      # captured turns to /v1/ingest. Unset → /v1/ingest is disabled. Set this
      # to a random secret if you enable the proxy profile.
      NAUTGATE_INGEST_TOKEN: ${NAUTGATE_INGEST_TOKEN:-}
      # Provider keys also reach core — quality-eval, shadow and the drift
      # investigator call models from here, not through the router.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      # Backups persist across restarts.
      - nautgate-backups:/root/.nautgate/backups
      # Uncomment to override the bundled routing/pricing tables with your own:
      # - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

  # Optional: capture clients that ignore OPENAI_BASE_URL (e.g. Codex in
  # ChatGPT-OAuth mode). Enable with `--profile proxy`, set NAUTGATE_INGEST_TOKEN
  # in your .env, then point the client at this proxy and trust its CA:
  #   docker compose --profile proxy up -d
  #   docker compose cp nautproxy:/home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem ./nautproxy-ca.pem
  #   export HTTPS_PROXY=http://127.0.0.1:8092 NODE_EXTRA_CA_CERTS=$PWD/nautproxy-ca.pem
  nautproxy:
    image: ghcr.io/48nauts-operator/nautproxy:latest
    # To build locally instead of pulling, comment out `image` and uncomment:
    # build:
    #   context: ..
    #   dockerfile: deploy/nautproxy.Dockerfile
    profiles: ["proxy"]
    depends_on:
      nautgate:
        condition: service_started
    environment:
      NAUTGATE_INGEST_URL: http://nautgate:8090/v1/ingest
      NAUTGATE_INGEST_TOKEN: ${NAUTGATE_INGEST_TOKEN:-}
      NAUTPROXY_AGENT_ID: ${NAUTPROXY_AGENT_ID:-codex}
    volumes:
      # CA persists across recreates — trust it once, not every restart.
      - nautproxy-ca:/home/mitmproxy/.mitmproxy
    ports:
      - "127.0.0.1:8092:8092"
    restart: unless-stopped

volumes:
  nautgate-db-data:
  nautgate-backups:
  nautproxy-ca:
