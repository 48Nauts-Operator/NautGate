# NautGate config — example. Copy to nautgate.yaml or set NAUTGATE_CONFIG_PATH.
# Env vars take precedence over file values.
#
# This file shows how to wire optional sidecar extensions into the plugin
# contract. With no `extensions:` block (or all entries commented out),
# NautGate runs in standalone mode — full audit + routing pipeline, no hooks.

# --- Plugin contract — sidecar extensions ---------------------------------
# Per Concept §"plugin contract". Each extension declares which hooks it
# subscribes to. Only POST <base_url>/v1/<hook_name> is called. Timeouts are
# overridable per-extension; before_route is synchronous (default 50ms),
# all other hooks are fire-and-forget.

extensions: {}
#   sb-capture:
#     base_url: http://sb-capture:8001
#     hooks: [on_request, on_response, on_outcome, after_route]
#     timeout_ms: 200
#
#   sb-brain:
#     base_url: http://sb-brain:8002
#     hooks: [before_route, on_outcome]
#     timeout_ms_before_route: 50    # synchronous hop — must stay tight
#     timeout_ms: 500                # fire-and-forget on_outcome
#
#   sb-privacy:
#     base_url: http://sb-privacy:8003
#     hooks: [before_route]
#     timeout_ms_before_route: 50

# --- Notes (env-var settings) ---------------------------------------------
# Most other settings live in environment variables, not this file:
#   NAUTGATE_DB_URL                 — required, Postgres URL
#   NAUTGATE_LISTEN_HOST/PORT       — bind address
#   NAUTGATE_LOG_LEVEL              — INFO / DEBUG / WARNING
#   NAUTROUTER_BASE_URL             — sidecar URL
#   NAUTGATE_OUTCOME_SPOOL_PATH     — durable spool fallback
#   NAUTGATE_ROUTING_CONFIG_PATH    — tier → provider/model table (default: ./config/routing.yaml)
#   NAUTGATE_CLASSIFY_LLM_CONFIRM   — true|false; opt-in CLASSIFY slow-path
