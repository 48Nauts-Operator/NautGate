# NautGate provider/model pricing — USD per MILLION tokens.
#
# Keys are "<provider>/<model>" matching what NautGate stores in
# route_decisions.decision_provider / decision_model. When a request lands
# at a (provider, model) not in this table, cost_usd is left NULL and a
# warning is logged once per missing pair.
#
# Sources (verify monthly, prices change):
#   Anthropic: https://docs.anthropic.com/en/docs/about-claude/pricing
#   OpenAI:    https://openai.com/api/pricing/
#   Google:    https://ai.google.dev/pricing
#
# `cache_read` / `cache_write` are reserved for future per-call cache
# accounting; current cost calc uses only `input` × prompt_tokens +
# `output` × completion_tokens.

pricing:
  # --- Anthropic (NautRouter's MODELS keys) ---
  # Both dotted and dashed forms are listed; Claude Code sends dashed snapshot
  # IDs like "claude-opus-4-7" / "claude-haiku-4-5" and we cost-lookup by the
  # raw decision_model. Date-suffixed snapshots are aliased to the same price.
  anthropic/claude-haiku-4.5: &haiku45
    input: 1.00
    output: 5.00
    cache_read: 0.10
    cache_write: 1.25
  anthropic/claude-haiku-4-5: *haiku45
  anthropic/claude-haiku-4-5-20251001: *haiku45
  anthropic/claude-sonnet-4: &sonnet4
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_write: 3.75
  anthropic/claude-sonnet-4-6: *sonnet4
  anthropic/claude-opus-4: &opus4
    input: 15.00
    output: 75.00
    cache_read: 1.50
    cache_write: 18.75
  anthropic/claude-opus-4-7: *opus4
  anthropic/claude-opus-4-8: *opus4
  # 1M-context variant (Claude Code model id). Long-context (>200K-token)
  # prompts carry an Anthropic premium not modeled here — base tier is a
  # close-enough default for typical sub-200K calls.
  "anthropic/claude-opus-4-8[1m]": *opus4
  # Claude 5 family. Rates read from OpenRouter's published pricing on
  # 2026-08-01, not derived — Opus 5 is cheaper than Opus 4, so the old
  # "newer tier costs more" assumption would have overstated it 3×.
  # Without these keys, subscription traffic on Opus 5 priced as NULL and
  # vanished from "Subscription saved" — 10,585 calls / 12.9M tokens of it.
  anthropic/claude-opus-5: &opus5
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write: 6.25
  "anthropic/claude-opus-5[1m]": *opus5
  anthropic/claude-opus-5-fast: &opus5fast
    input: 10.00
    output: 50.00
    cache_read: 1.00
    cache_write: 12.50
  "anthropic/claude-opus-5-fast[1m]": *opus5fast
  anthropic/claude-sonnet-5: &sonnet5
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
  "anthropic/claude-sonnet-5[1m]": *sonnet5

  # Fable 5: input rate from Andre ($50/M). output/cache derived from the same
  # ratios every other Anthropic tier here uses (output = 5× input, cache_read
  # = input/10, cache_write = input × 1.25). CORRECT `output` if Fable's ratio
  # differs from the standard 5×.
  anthropic/claude-fable-5: &fable5
    input: 50.00
    output: 250.00
    cache_read: 5.00
    cache_write: 62.50
  "anthropic/claude-fable-5[1m]": *fable5

  # --- OpenAI ---
  openai/gpt-4o-mini:
    input: 0.15
    output: 0.60
    cache_read: 0.075
  openai/gpt-4o:
    input: 2.50
    output: 10.00
    cache_read: 1.25
  # gpt-5.6 family — rates fetched live from openrouter.ai/api/v1/models
  # (2026-07-22). Cross-checked against real OpenRouter generations: 51,019 in
  # / 171 out billed $0.0343, table gives $0.0353 — the delta is cache-read
  # discount, so these are right.
  openai/gpt-5.6-sol: &gpt56sol
    input: 5.00
    output: 30.00
  openai/gpt-5.6-sol-pro: *gpt56sol
  openai/gpt-5.6-terra: &gpt56terra
    input: 2.50
    output: 15.00
  openai/gpt-5.6-terra-pro: *gpt56terra
  openai/gpt-5.6-luna:
    input: 1.00
    output: 6.00
  openai/gpt-5.5:
    input: 5.00
    output: 30.00

  # --- Google Gemini ---
  gemini/gemini-2.5-flash:
    input: 0.15
    output: 0.60
  gemini/gemini-2.5-pro:
    input: 1.25
    output: 10.00

  # --- OpenRouter (meta-provider) ---
  # openrouter/auto: pricing varies — fall back to NULL cost; the actual model
  # used is recorded in response_body.model and can be priced retroactively.
  openrouter/openrouter/auto: { input: 0, output: 0 }
  openrouter/openrouter/google/gemini-flash:
    input: 0.15
    output: 0.60
  openrouter/openrouter/openai/gpt-4o-mini:
    input: 0.15
    output: 0.60
  openrouter/openrouter/anthropic/claude-haiku:
    input: 1.00
    output: 5.00
  openrouter/openrouter/meta-llama/llama-3.3-70b:
    input: 0.13
    output: 0.40
  openrouter/openrouter/qwen/qwen-2.5-72b:
    input: 0.13
    output: 0.40
  openrouter/openrouter/google/gemini-pro:
    input: 1.25
    output: 5.00
  openrouter/openrouter/anthropic/claude-sonnet:
    input: 3.00
    output: 15.00
  openrouter/openrouter/deepseek/deepseek-chat:
    input: 0.32
    output: 0.89
  openrouter/openrouter/deepseek/deepseek-v4-flash:
    input: 0.14
    output: 0.28
  openrouter/openrouter/deepseek/deepseek-v4-pro:
    input: 0.43
    output: 0.87
  openrouter/openrouter/moonshotai/kimi-k2-thinking:
    input: 0.60
    output: 2.50
  # refreshed from openrouter.ai/api/v1/models 2026-07-22 (was 0.75/3.50)
  openrouter/openrouter/moonshotai/kimi-k2.6:
    input: 0.68
    output: 3.42

  # --- Local (free) ---
  lmstudio/local: { input: 0, output: 0 }
  anthropic/local: { input: 0, output: 0 }
