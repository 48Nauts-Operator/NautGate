# NautGate tier → provider/model routing table.
#
# Pinned models on every tier (no `openrouter/auto`). The `auto` selector
# adds OpenRouter's own classification + selection step on top of ours,
# which roughly doubles the routing latency. Pinning keeps the call path
# short: NautGate scores → tier → fixed model → OpenRouter passthrough →
# provider. Audit log captures the upstream's response.model so you still
# see the actual provider that served the call.

tiers:
  fast:
    primary:  { provider: openrouter, model: openrouter/google/gemini-flash }
    fallback: { provider: openrouter, model: openrouter/openai/gpt-4o-mini }
  balanced:
    primary:  { provider: openrouter, model: openrouter/anthropic/claude-haiku }
    fallback: { provider: openrouter, model: openrouter/google/gemini-flash }
  deep:
    primary:  { provider: anthropic,  model: claude-sonnet-4 }
    fallback: { provider: openrouter, model: openrouter/anthropic/claude-haiku }
  expert:
    primary:  { provider: anthropic,  model: claude-opus-4 }
    fallback: { provider: anthropic,  model: claude-sonnet-4 }
