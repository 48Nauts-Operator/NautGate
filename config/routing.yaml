# NautGate tier → provider/model routing table.
#
# Used when the caller passes model: "auto". The 14-dimension scorer
# (app/scoring.py) maps the request to a tier; this table maps tier → route.
# `primary` is tried first; `fallback` when primary is unhealthy or banned.
#
# IMPORTANT: model IDs here must match keys in NautRouter's MODELS map
# (vendor/NautRouter/src/index.ts) — NautRouter only honors a forwarded
# model when it recognizes the ID; otherwise it ignores us and auto-routes.
#
# Current NautRouter MODELS keys (2026-05-09):
#   claude-opus-4, claude-sonnet-4, claude-haiku-4.5,
#   gemini-2.5-flash, gemini-2.5-pro, local

tiers:
  fast:
    primary:  { provider: anthropic, model: claude-haiku-4.5 }
    fallback: { provider: anthropic, model: claude-haiku-4.5 }
  balanced:
    primary:  { provider: anthropic, model: claude-haiku-4.5 }
    fallback: { provider: anthropic, model: claude-sonnet-4 }
  deep:
    primary:  { provider: anthropic, model: claude-sonnet-4 }
    fallback: { provider: anthropic, model: claude-haiku-4.5 }
  expert:
    primary:  { provider: anthropic, model: claude-opus-4 }
    fallback: { provider: anthropic, model: claude-sonnet-4 }
