# NautGate tier → provider/model routing table.
#
# Goal: route through OpenRouter by default so we get cheap multi-provider
# routing + observability into what gets picked. Direct-Anthropic only at the
# top of the stack where we explicitly want Opus/Sonnet quality.
#
# OpenRouter's `openrouter/auto` lets OpenRouter pick the model dynamically
# based on the prompt — our audit log captures the *actually-used* model in
# the response body's `model` field so we can see what it chose.

tiers:
  fast:
    # Cheap-by-default: Gemini Flash via OpenRouter (~$0.15/M, ~7× cheaper than Haiku).
    primary:  { provider: openrouter, model: openrouter/google/gemini-flash }
    fallback: { provider: openrouter, model: openrouter/openai/gpt-4o-mini }
  balanced:
    # Let OpenRouter auto-select for the medium-complexity middle ground.
    primary:  { provider: openrouter, model: openrouter/auto }
    fallback: { provider: openrouter, model: openrouter/anthropic/claude-haiku }
  deep:
    # Heavy reasoning — still let OpenRouter pick, fall through to direct Anthropic.
    primary:  { provider: openrouter, model: openrouter/auto }
    fallback: { provider: anthropic,  model: claude-sonnet-4 }
  expert:
    # Top-of-stack — direct to Anthropic for Opus, OpenRouter for Sonnet fallback.
    primary:  { provider: anthropic,  model: claude-opus-4 }
    fallback: { provider: openrouter, model: openrouter/auto }
