# NautGate tier → provider/model routing table.
#
# AIM: cheap by default, expensive only when the score genuinely demands it.
# Most prompts score below 0.5 — those should never touch Sonnet/Opus.
# Real cheap-model coverage:
#   fast / balanced → Gemini Flash ($0.15/$0.60 per M, 1M context)
#   deep            → Gemini Pro ($1.25/$5, 1M context — handles Pi's big workload)
#   expert          → Sonnet direct (only on score ≥ 0.5)
#
# Pinned models so OpenRouter doesn't add its own auto-selection latency hop.

tiers:
  fast:
    primary:  { provider: openrouter, model: openrouter/google/gemini-flash }
    fallback: { provider: openrouter, model: openrouter/deepseek/deepseek-chat }
  balanced:
    # Same cheap model as fast — 99% of routine work doesn't need more.
    primary:  { provider: openrouter, model: openrouter/google/gemini-flash }
    fallback: { provider: openrouter, model: openrouter/openai/gpt-4o-mini }
  deep:
    # 1M context for code-heavy / long-history workloads (Pi's typical shape).
    primary:  { provider: openrouter, model: openrouter/google/gemini-pro }
    fallback: { provider: openrouter, model: openrouter/anthropic/claude-haiku }
  expert:
    # Only when score ≥ 0.5 — real reasoning, not casual chatter.
    primary:  { provider: openrouter, model: openrouter/anthropic/claude-sonnet }
    fallback: { provider: anthropic,  model: claude-sonnet-4 }
