[project]
name = "nautgate-core"
version = "0.3.0"
description = "NautGate — memory-aware LLM gateway core"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "cryptography>=42",
]

[project.optional-dependencies]
# nautproxy only. The gateway never imports mitmproxy — only the standalone
# addon in proxy/codex_capture.py does, and the shipped sidecar image is built
# FROM mitmproxy/mitmproxy, so it does not need this either. As a hard
# dependency it was ~49 MB of a 150 MB venv (an 18 MB Rust extension and a 6 MB
# macOS binary among it) that nobody running the gateway ever loaded.
#   uv sync --extra proxy    # to work on the capture proxy
proxy = ["mitmproxy>=12.2.3"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "asgi-lifespan>=2.1",
    "packaging>=26.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
# ASYNC240: pathlib in async — the migration runner reads SQL once at startup; sync IO is fine.
# ASYNC230: ditto for open() at startup. Tighten if migrations grow beyond a single file.
ignore = ["E501", "ASYNC240", "ASYNC230"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
