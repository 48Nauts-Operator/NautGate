[project]
name = "nautgate-core"
version = "0.1.0"
description = "NautGate — memory-aware LLM gateway core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.51.0",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "mitmproxy>=12.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "asgi-lifespan>=2.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
# ASYNC240: pathlib in async — the migration runner reads SQL once at startup; sync IO is fine.
# ASYNC230: ditto for open() at startup. Tighten if migrations grow beyond a single file.
ignore = ["E501", "ASYNC240", "ASYNC230"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
